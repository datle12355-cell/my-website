function setCl(s,u,v){const m=S[s].sq.flatMap(q=>q.m).find(m=>m.u==u),fx=UE[s][u],r=m.max?m.hp/m.max:1;fx.cl=v==m.c0?-1:v;m.c=v;m.max=CL[v].hp*10*ST[s].hp*(m.k||1);m.hp=m.st==1?0:Math.max(1,r*m.max);m.ul=0;m.ha=0;buildSq();upd()}
function fixTV(){const tv=CL.map((c,i)=>/Tố Vấn/.test(c.n)?i:-1).filter(i=>i>=0);if(!tv.length)return;for(const x of'RB'){let n=sum(tv.map(i=>+CL[i].c[x]||0)),need=10-n;if(need<=0)continue;let tot=sum(CL.map(c=>+c.c[x]||0));CL[tv[0]].c[x]=(+CL[tv[0]].c[x]||0)+need;need=Math.min(need,tot+need-60);while(need>0){let b=-1,bv=0;CL.forEach((c,i)=>{if(tv.includes(i))return;const v=+c.c[x]||0;if(v>bv){bv=v;b=i}});if(b<0)break;CL[b].c[x]--;need--}}}

return x+'</div></div>'}
function buildSq(){for(const s of'RB'){$('#sq'+s).innerHTML=`<div class=sqh style="border-color:${COL[s]}"><b style="color:${COL[s]}">${NM[s]}</b><button onclick="exAll('${s}',1)">▾ Mở rộng</button><button onclick="exAll('${s}',0)">▸ Thu gọn</button><button id=op${s} onclick="optS('${s}')">🔍 Tối ưu</button></div>`+S[s].sq.map(q=>`<div class="card${EXP[s+q.id]?' ex':''}" id=cd${s}${q.id} style="border-left:4px solid ${COL[s]}"><div class=ch><input class=tx style="width:74px;font-weight:700" title="Đổi tên tổ" value="${tn(s,q.id).replace(/"/g,'&quot;')}" onchange="TN['${s}${q.id}']=this.value.trim().slice(0,20)"><button onclick="tgx('${s}',${q.id})">▾</button><button onclick="sel('${s}',${q.id})">🎯</button><button onclick="auto('${s}',${q.id})">A</button><span id=qn${s}${q.id}></span></div><div><select onchange="chRole('${s}',${q.id-1},+this.value)">${['Tuyến trên','Tuyến giữa','Tuyến dưới','Lương trên','Lương dưới'].map((n,i)=>`<option value=${i} ${q.role==i?'selected':''}>${n}</option>`).join('')}</select><select title="Phản ứng" onchange="MD['${s}'][${q.id-1}]=S['${s}'].sq[${q.id-1}].mode=+this.value">${['Tự động','Tấn công','Phòng thủ','Công trụ','Cơ động'].map((n,i)=>`<option value=${i} ${q.mode==i?'selected':''}>${n}</option>`).join('')}</select> <small id=qs${s}${q.id}></small></div><div class=bar><i id=qh${s}${q.id} style="background:${COL[s]}"></i></div><div class=bar><i id=qu${s}${q.id} style="background:#fc0"></i></div><div class=rings>${q.m.map(m=>`<span class=rg id=rg${s}${m.u}><span class=rg2 id=rr${s}${m.u}><span class=ic>${CL[m.c].i}</span></span></span>`).join('')}</div><div class=dt>${q.m.map(m=>mrow(s,q,m)).join('')}</div></div>`).join('')}}

function updSq(s){const o=S[s];o.sq.forEach(q=>{const n=alive(q).length,id=s+q.id;$('#qs'+id).textContent=q.st+(q.man?' ✋→'+q.man:q.tac?' ⚑→'+q.tac.n:'');$('#cd'+id).classList.toggle('sel',!!SEL&&SEL.s==s&&SEL.id==q.id);$('#qn'+id).textContent=n+'/'+q.m.length;$('#qh'+id).style.width=100*sum(alive(q).map(m=>m.hp))/Math.max(1,sum(q.m.map(m=>m.max)))+'%';$('#qu'+id).style.width=q.ult+'%';
q.m.forEach(m=>{const hp=Math.max(0,m.hp/m.max*100),ul=sk(m)=='buff'?(m.ul||0):q.ult,col=hp>50?'#4c4':hp>25?'#fb0':'#e33',r=m.st?(m.st==1?'⏳':'🏃')+rally(q,m)+'s':'',id2=s+m.u;

$('#mh'+id2).style.width=hp+'%';$('#mh'+id2).style.background=col;$('#mu'+id2).style.width=ul+'%';$('#mt'+id2).textContent=Math.ceil(m.hp)+'/'+Math.ceil(m.max)+' · '+(sk(m)=='buff'?'Trường ca ':'Ult ')+Math.floor(ul)+'% '+r+(m.k?' ⭐+'+Math.round((m.k-1)*100)+'%':'')})})}
function potS(s,live){let hp=0,at=0,pd=0,hl2=0;S[s].sq.forEach(q=>q.m.forEach(m=>{if(live&&m.st)return;const c=CL[m.c],k=(m.k||1)*(1+m.fx.dm/100);hp+=live?m.hp:m.max;at+=mw(m);pd+=isTV(m)?0:c.pd*k;if(isTV(m))hl2+=(c.atk||1)*CFG.dk*CFG.tvp*k/(m.fx.hi>0?m.fx.hi:CFG.tvi)}));const f=ST[s].atk*bm(s);return{hp,at:at*f,pd:pd*ST[s].pd*bm(s),hl:hl2*f}}
function dfHtml(){const row=(n,live)=>{const a=potS('R',live),b=potS('B',live),pc=(x,y)=>y>0?Math.round((x/y-1)*1000)/10:(x>0?100:0),f=v=>`<b style="color:${v>0?COL.R:v<0?COL.B:'inherit'}">${v>0?'+':''}${v}%</b>`,hpv=pc(a.hp,b.hp),atv=pc(a.at,b.at),pdv=pc(a.pd,b.pd),hlv=pc(a.hl,b.hl),tot=pc(Math.sqrt(a.hp*a.at),Math.sqrt(b.hp*b.at));return`<div><b>${n}</b> (Đỏ so với Xanh): Máu ${f(hpv)} · Sát thương ${f(atv)} · Dmg trụ ${f(pdv)} · Hồi máu ${f(hlv)} · <u>Tổng hợp ${f(tot)}</u></div>`};const dr=Math.round((dfm('R')-dfm('B'))*1000)/10;return row('Tiềm lực gốc',0)+row('Hiện tại (quân đang sống)',1)+`<div style="font-size:11px;opacity:.8">Tổng hợp = √(Máu × Sát thương). Phòng thủ theo tiềm lực: Đỏ nhận ${Math.round(dfm('R')*100)}% ST, Xanh nhận ${Math.round(dfm('B')*100)}% ST. Màu đỏ/xanh = bên đang hơn.</div>`}
function sumHtml(){return'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+['R','B'].map(s=>{let T=nst(),rows=S[s].sq.map(q=>q.m.map(m=>{for(const k in T)T[k]+=m.s[k];return`<tr><td>${tn(s,q.id)}·${CL[m.c].i} ${pnm(s,m)}<td>${m.s.k}<td>${Math.round(m.s.d)}<td>${Math.round(m.s.tk)}<td>${Math.round(m.s.h)}<td>${Math.round(m.s.l)}<td>${m.s.x}<td>${Math.round(m.s.p/1000)}k</tr>`}).join('')).join('');return`<div class=cl><b style="color:${COL[s]}">${NM[s]}</b><table class=sm><tr><th>Quân<th>Hạ gục<th>Sát thương<th>Chịu ST<th>Hồi máu<th>Lương<th>Chết<th>Dmg trụ</tr>${rows}<tr><th>Tổng<th>${T.k}<th>${Math.round(T.d)}<th>${Math.round(T.tk)}<th>${Math.round(T.h)}<th>${Math.round(T.l)}<th>${T.x}<th>${Math.round(T.p/1000)}k</tr></table></div>`}).join('')+'</div>'}
async function optS(s){if(OPT){OPT=false;return}
const b=$('#op'+s),R0=Math.random,rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const sv={r:ROLES[s].slice(),m:MD[s].slice()};OPT=true;run=false;
const sim1=seed=>{Math.random=rng(seed);QUIET=true;rst();prep=false;let n=0;while(!over&&n<6000){step(.25);n++}QUIET=false;Math.random=R0;return over==s?1:(over=='D'||!over)?.5:0};
const ev=async(r,m,seeds)=>{ROLES[s]=r.slice();MD[s]=m.slice();let w=0;for(const sd of seeds){if(!OPT)return-1;w+=sim1(sd);await new Promise(z=>setTimeout(z,0))}return w/seeds.length};
let br=sv.r.slice(),bq=sv.m.slice(),bf=await ev(br,bq,[31,32,33]);
for(let i=0;i<18&&OPT;i++){const r=br.slice(),m=bq.slice(),j=Math.floor(R0()*10);if(R0()<.5)r[j]=Math.floor(R0()*5);else m[j]=Math.floor(R0()*5);const f=await ev(r,m,[31,32,33]);if(f<0)break;if(f>bf){bf=f;br=r;bq=m}b.textContent=`🔍 ${i+1}/18 · ${Math.round(bf*100)}%`}
const V=[41,42,43,44,45,46],vb=OPT?await ev(br,bq,V):-1,vo=OPT?await ev(sv.r,sv.m,V):-1,ok=OPT&&vb>=vo;
ROLES[s]=ok?br:sv.r;MD[s]=ok?bq:sv.m;Math.random=R0;QUIET=false;OPT=false;rst();
log(ok?`🔍 ${NM[s]}: tối ưu xong, thắng ${Math.round(vo*100)}% → ${Math.round(vb*100)}% (6 ván kiểm chứng)`:`🔍 ${NM[s]}: giữ đội hình hiện tại`);upd()}
function chRole(s,i,v){const q=S[s].sq[i];q.role=v;ROLES[s][i]=v;if(prep)place(q);else{q.goal=null;if(v<3)q.stage=0}}
function hb(s){const o=S[s];if(!HUM[s])return'<i style="font-size:11px">AI điều khiển</i>';return`<button onclick="buyM('${s}')">+Sĩ khí</button><button ${t>=(o.hcd||0)?'':'disabled'} onclick="heal('${s}')">Hồi cờ${t<(o.hcd||0)?' '+Math.ceil(o.hcd-t)+'s':''}</button>`+['ba','cong','toc','thu'].map(b=>`<button ${BU&&BU.includes(b)&&t>=o.bcd?'':'disabled'} onclick="buyB('${s}','${b}')">${BN[b]}</button>`).join('')}
let lastH='';
function upd(){$('#clk').textContent=fmt(CFG.tot-t);$('#bgo').textContent=over?'🏁 Kết thúc':prep?'▶ Bắt đầu':run?'⏸ Tạm dừng':'▶ Tiếp tục';$('#ph').textContent=over?(over=='D'?'🏁 HÒA':'🏁 '+NM[over]+' THẮNG'):prep?`Chuẩn bị ${Math.ceil(prepT)}s`:run?'Đang đánh':'Tạm dừng';
for(const s of'RB'){const o=S[s],e=s=='R'?'B':'R';$('#k'+s).innerHTML=`<span class=big style="color:${COL[s]}">${o.kill}</span><small>/9 trụ</small> <span class=tile>💰 ${Math.floor(o.lu)}</span><span class=tile title="Sĩ khí">🎖️ ${o.mor}/10</span><span class=tile title="Số mạng hạ gục">⚔️ ${o.mk}</span>`;$('#f'+s).style.width=o.fl+'%';
$('#p'+s).innerHTML=`<small>Máu cờ ${o.fl.toFixed(1)}% · trụ còn: </small>`+o.pil.map(p=>`<span class="chip ${p.alive?'':'d'}" style="border-left:4px solid ${COL[s]}">${p.alive?'🏯':'💥'} T${p.t}·${p.n} ${Math.ceil(p.hp/p.max*100)}%</span>`).join('')+'<br><small>Buff: '+(Object.keys(o.bf).filter(b=>o.bf[b]>t).map(b=>BN[b]+' '+Math.ceil(o.bf[b]-t)+'s').join(', ')||'—')+(BU?'':' · mở khi còn '+fmt(CFG.bunl))+'</small>';
const h=hb(s)+(BU?'':'')+Math.floor(t/2)*(HUM[s]?1:0);if($('#h'+s).dataset.k!=h){$('#h'+s).dataset.k=h;$('#h'+s).innerHTML=hb(s)}
updSq(s)}
$('#df').innerHTML=dfHtml();$('#log').innerHTML=LOG.join('<br>');if(over&&!SUMD){SUMD=true;tab(4)}if(!$('#t4').hidden&&(++SUMT%4==0||over))$('#t4').innerHTML=sumHtml()}
$('#spd').innerHTML=[1,2,5,10,30].map(v=>`<button onclick="speed=${v}">x${v}</button>`).join('');
$('#scn').innerHTML=SCN.map((s,i)=>`<option value=${i}>${s[0]}</option>`).join('');['B','R'].forEach(x=>$('#th'+x).innerHTML=`<option value=0>${NM[x]}: không TH</option>`+TH.map((h,i)=>`<option value=${i+1}>${NM[x]} TH${i+1} · ${h[0]}</option>`).join(''));
let last=0,acc=0,uT=0;function loop(ts){const d=Math.min(.1,(ts-last)/1000);last=ts;if(run||prep&&run){acc+=d*speed;while(acc>=.25){step(.25);acc-=.25}}if(!run)acc=0;if(!OPT){draw();uT+=d;if(uT>.25){uT=0;upd()}}requestAnimationFrame(loop)}
let SEL=null;
function sel(s,i){if(!HUM[s]){log('Hãy chọn chế độ có người chơi cho '+NM[s]);return}SEL={s,id:i};const q=S[s].sq[i-1];q.hold=1;q.man=null;q.stage=0;q.goal=null}
function auto(s,i){const q=S[s].sq[i-1];q.man=null;q.hold=0;q.goal=null;q.stage=0}
$('#cv').addEventListener('click',ev=>{const r=$('#cv').getBoundingClientRect(),cx=(ev.clientX-r.left)*1678/r.width,cy=(ev.clientY-r.top)*937/r.height;
for(const s of'RB')for(const q of S[s].sq){if(!alive(q).length)continue;const x=q.x+(q.id%3-1)*9,y=q.y+(q.id%4-1.5)*5;if(Math.hypot(cx-x,cy-y)<24){sel(s,q.id);return}}
if(!SEL||!HUM[SEL.s])return;const q=S[SEL.s].sq[SEL.id-1];let n=null;
for(const s of'RB'){for(const p of S[s].pil)if(Math.hypot(cx-p.p[0],cy-p.p[1])<40)n=p.n;if(Math.hypot(cx-FLAG[s].p[0],cy-FLAG[s].p[1])<40)n=FLAG[s].n}
if(!n){let b=80;for(const k in G){const d=Math.hypot(cx-P(k)[0],cy-P(k)[1]);if(d<b){b=d;n=k}}}
if(n){q.man=n;q.hold=0;q.stage=0;q.goal=null;log(`${NM[SEL.s]} ${tn(SEL.s,q.id)} → ${n}`)}});
addEventListener('keydown',e=>{if(e.code=='Space'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();go()}});
load();rst();requestAnimationFrame(loop);
